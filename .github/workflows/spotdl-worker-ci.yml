name: spotDL Worker CI

on:
  pull_request:
    branches:
      - main
      - feat/studio-web-foundation
    paths:
      - "spotdl-worker/**"
      - "studio/**"
      - ".github/workflows/spotdl-worker-ci.yml"
  push:
    branches:
      - feat/spotdl-worker-integration
    paths:
      - "spotdl-worker/**"
      - "studio/**"
      - ".github/workflows/spotdl-worker-ci.yml"

permissions:
  contents: read

jobs:
  spotdl-worker:
    name: spotDL worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spotdl-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spotdl-worker/requirements.txt
      - name: Install worker dependencies
        run: python -m pip install -r requirements.txt
      - name: Run worker tests
        run: python -m unittest -v
      - name: Build worker image
        run: docker build -t spicetify-spotdl-worker .
  studio:
    name: Studio checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Syntax checks
        run: npm run check
      - name: Smoke tests
        run: npm test
